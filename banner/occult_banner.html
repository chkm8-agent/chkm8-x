<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#e8dcbc}canvas{display:block}</style></head>
<body>
<canvas id="c"></canvas>
<script>
const W = 1500, H = 500;
const cv = document.getElementById('c');
const dpr = window.devicePixelRatio || 1;
cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
const g = cv.getContext('2d'); g.scale(dpr, dpr);

const CREAM = '#efe3c4', INK = '#0e0d0b', PAPER = '#e8dcbc';
let seed = 77; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------- paper background with grain ----------
g.fillStyle = PAPER; g.fillRect(0, 0, W, H);
for (let i = 0; i < 9000; i++) {
  g.fillStyle = `rgba(90,70,40,${rnd() * 0.06})`;
  g.fillRect(rnd() * W, rnd() * H, 1 + rnd() * 1.5, 1 + rnd() * 1.5);
}

// ---------- helpers ----------
function star(x, y, r, pts = 4, inner = 0.28) {
  g.beginPath();
  for (let i = 0; i < pts * 2; i++) {
    const a = -Math.PI / 2 + i * Math.PI / pts, rr = i % 2 ? r * inner : r;
    g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  g.closePath(); g.fill();
}
function stars(x0, y0, w, h, n, avoid) {
  g.fillStyle = CREAM;
  for (let i = 0; i < n; i++) {
    const x = x0 + rnd() * w, y = y0 + rnd() * h;
    if (avoid && avoid(x, y)) continue;
    const t = rnd();
    if (t < 0.55) { g.beginPath(); g.arc(x, y, 0.6 + rnd() * 0.9, 0, 7); g.fill(); }
    else star(x, y, 2.5 + rnd() * 4.5, 4, 0.25);
  }
}
function rays(cx, cy, r0, r1, n, wobble = 0, lw = 1) {
  g.strokeStyle = CREAM; g.lineWidth = lw;
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, L = r1 * (i % 2 ? 0.78 : 1) * (1 + (rnd() - 0.5) * wobble);
    g.beginPath(); g.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
    g.lineTo(cx + Math.cos(a) * L, cy + Math.sin(a) * L); g.stroke();
  }
}
function triRays(cx, cy, r0, r1, n) { // tapered sun spikes
  g.fillStyle = CREAM;
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, L = i % 2 ? r1 * 0.7 : r1, d = Math.PI / n * 0.45;
    g.beginPath();
    g.moveTo(cx + Math.cos(a - d) * r0, cy + Math.sin(a - d) * r0);
    g.lineTo(cx + Math.cos(a) * L, cy + Math.sin(a) * L);
    g.lineTo(cx + Math.cos(a + d) * r0, cy + Math.sin(a + d) * r0);
    g.closePath(); g.fill();
  }
}
function hatchClouds(x, y, w, dir = 1) { // engraved cloud puffs
  g.strokeStyle = CREAM; g.lineWidth = 1.1;
  for (let k = 0; k < 3; k++) {
    const r = w * (0.22 - k * 0.04), cx = x + dir * k * w * 0.28, cy = y - k * 4;
    g.beginPath(); g.arc(cx, cy, r, Math.PI, 0); g.stroke();
    g.beginPath(); g.arc(cx, cy, r * 0.7, Math.PI, 0); g.stroke();
  }
}

function hatchCurrent(sp, ang, alpha, lw = 0.7) { // engraved hatching inside the current path
  g.save(); g.clip();
  g.strokeStyle = `rgba(239,227,196,${alpha})`; g.lineWidth = lw;
  const c = Math.cos(ang), s = Math.sin(ang);
  for (let t = -900; t < 900; t += sp) { g.beginPath(); g.moveTo(750 + c * -900 - s * t, 250 + s * -900 + c * t); g.lineTo(750 + c * 900 - s * t, 250 + s * 900 + c * t); g.stroke(); }
  g.restore();
}
// ---------- card frame ----------
function card(x, y, w, h, title, numeral) {
  g.save();
  // outer card edge: mid tone -> grades to the source's aged tan border
  g.fillStyle = '#b4b4b4'; g.beginPath(); g.roundRect(x, y, w, h, 4); g.fill();
  // black field
  const m = 5;
  g.fillStyle = INK; g.fillRect(x + m, y + m, w - 2 * m, h - 2 * m);
  // inner double rule
  g.strokeStyle = CREAM; g.lineWidth = 1.2;
  g.strokeRect(x + m + 5, y + m + 5, w - 2 * m - 10, h - 2 * m - 10);
  g.lineWidth = 0.6;
  g.strokeRect(x + m + 8, y + m + 8, w - 2 * m - 16, h - 2 * m - 16);
  // corner diamonds
  g.fillStyle = CREAM;
  [[x + m + 5, y + m + 5], [x + w - m - 5, y + m + 5], [x + m + 5, y + h - m - 5], [x + w - m - 5, y + h - m - 5]]
    .forEach(([cx, cy]) => star(cx, cy, 6, 4, 0.35));
  // title plates
  const ph = 26;
  g.fillStyle = CREAM;
  g.fillRect(x + m + 14, y + h - m - 14 - ph, w - 2 * m - 28, ph);
  g.fillStyle = INK; g.font = '700 14px "Cormorant Garamond", "Times New Roman", Georgia, serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(title, x + w / 2, y + h - m - 14 - ph / 2 + 1);
  // numeral top
  g.fillStyle = CREAM; g.font = '700 17px "Times New Roman", Georgia, serif';
  g.fillText(numeral, x + w / 2, y + m + 26);
  g.strokeStyle = CREAM; g.lineWidth = 0.8;
  g.beginPath(); g.moveTo(x + w / 2 - 34, y + m + 26); g.lineTo(x + w / 2 - 18, y + m + 26);
  g.moveTo(x + w / 2 + 18, y + m + 26); g.lineTo(x + w / 2 + 34, y + m + 26); g.stroke();
  g.restore();
  return { x: x + m + 10, y: y + m + 42, w: w - 2 * m - 20, h: h - 2 * m - 42 - ph - 22 };
}

// ---------- THE BLIND HORSEMAN ----------
function horseman(b) {
  g.save(); g.beginPath(); g.rect(b.x, b.y, b.w, b.h); g.clip();
  const cx = b.x + b.w / 2, cy = b.y + b.h * 0.42;
  // big halo moon behind rider
  stars(b.x, b.y, b.w, b.h, 60, (x, y) => Math.hypot(x - cx, y - cy) < b.w * 0.5);
  triRays(cx, cy, b.w * 0.33, b.w * 0.5, 28);
  g.fillStyle = CREAM; g.beginPath(); g.arc(cx, cy, b.w * 0.32, 0, 7); g.fill();
  g.strokeStyle = INK; g.lineWidth = 1;
  for (let r = b.w * 0.29; r > b.w * 0.27; r -= 3) { g.beginPath(); g.arc(cx, cy, r, 0, 7); g.stroke(); }

  // horse + rider silhouette in a 100x100 unit box
  const S = b.w / 100 * 1.12, ox = cx - 52 * S, oy = cy - 30 * S;
  const P = (x, y) => [ox + x * S, oy + y * S];
  const path = (pts) => { g.beginPath(); pts.forEach((p, i) => { const [X, Y] = P(...p); i ? g.lineTo(X, Y) : g.moveTo(X, Y); }); };
  g.fillStyle = INK; g.strokeStyle = CREAM; g.lineWidth = 1.4; g.lineJoin = 'round';

  // tail
  g.beginPath(); { const a = P(20, 46), c1 = P(8, 52), c2 = P(10, 70), e = P(4, 80);
    g.moveTo(...a); g.bezierCurveTo(...c1, ...c2, ...e);
    const c3 = P(16, 70), c4 = P(14, 56), e2 = P(22, 50); g.bezierCurveTo(...c3, ...c4, ...e2); g.closePath(); }
  g.fill(); g.stroke(); hatchCurrent(2.5, 1.3, 0.45);

  // horse body (walking, right-facing, one foreleg raised)
  path([
    [74, 44], [78, 34], [82, 26], [83, 19], [85, 23], [87, 18], [88, 25], [93, 31], [97, 38], [96, 41], [91, 41],
    [86, 37], [81, 41], [79, 50], [78, 56],
    [80, 62], [86, 66], [88, 70], [85, 71], [79, 66], [74, 60], // raised foreleg
    [72, 64], [73, 80], [76, 84], [70, 84], [68, 66],            // standing foreleg
    [60, 62], [46, 62],
    [42, 66], [43, 80], [46, 84], [40, 84], [37, 68],            // near hind leg
    [32, 64], [27, 70], [26, 82], [29, 85], [23, 85], [21, 70], [19, 58], // far hind leg
    [18, 50], [22, 42], [32, 39], [46, 41], [58, 41], [66, 38]
  ]); g.closePath(); g.fill(); g.stroke(); hatchCurrent(3.2, 0.9, 0.38);
  // mane
  g.strokeStyle = CREAM; g.lineWidth = 1;
  for (let i = 0; i < 6; i++) { const [a, b2] = P(80 - i * 1.6, 22 + i * 3.4), [c, d] = P(74 - i * 1.6, 26 + i * 3.4); g.beginPath(); g.moveTo(a, b2); g.lineTo(c, d); g.stroke(); }
  // eye + bridle
  g.fillStyle = CREAM; { const [ex, ey] = P(89, 28); g.beginPath(); g.arc(ex, ey, 1.4, 0, 7); g.fill(); }
  g.beginPath(); { const a = P(95, 39), c = P(62, 30); g.moveTo(...a); g.lineTo(...c); } g.lineWidth = 0.9; g.stroke();
  // saddle cloth with fringe
  path([[44, 41], [60, 41], [62, 54], [42, 54]]); g.fillStyle = INK; g.fill(); g.lineWidth = 1.2; g.stroke();
  for (let i = 0; i < 8; i++) { const [a, b2] = P(43 + i * 2.6, 54), [c, d] = P(43 + i * 2.6, 57); g.beginPath(); g.moveTo(a, b2); g.lineTo(c, d); g.stroke(); }

  // rider: hooded cloak
  g.fillStyle = INK; g.strokeStyle = CREAM; g.lineWidth = 1.4;
  path([[50, 42], [46, 30], [44, 20], [47, 11], [52, 7], [57, 10], [58, 18], [57, 26], [60, 34], [58, 46], [40, 50], [30, 46], [38, 40]]);
  g.closePath(); g.fill(); g.stroke(); hatchCurrent(2.6, -0.5, 0.3);
  // cloak folds
  g.lineWidth = 0.8;
  [[[48, 24], [42, 44]], [[52, 26], [46, 46]], [[55, 28], [52, 46]]].forEach(([a, c]) => { g.beginPath(); g.moveTo(...P(...a)); g.lineTo(...P(...c)); g.stroke(); });
  // face (skull-ish) in hood
  g.fillStyle = CREAM; { const [fx, fy] = P(53.5, 15); g.beginPath(); g.ellipse(fx, fy, 3.4 * S, 4.4 * S, 0, 0, 7); g.fill(); }
  // blindfold band + trailing ribbons
  g.fillStyle = INK; { const [a, b2] = P(49.5, 13), [c, d] = P(57.5, 13); g.fillRect(a, b2, c - a, 2.4 * S); }
  g.strokeStyle = CREAM; g.lineWidth = 1.2;
  g.beginPath(); g.moveTo(...P(49.5, 13.5)); g.lineTo(...P(57.5, 13.5)); g.moveTo(...P(49.5, 15.6)); g.lineTo(...P(57.5, 15.6)); g.stroke();
  g.fillStyle = CREAM;
  [[0, 0], [2, 4]].forEach(([dx, dy]) => {
    g.beginPath(); g.moveTo(...P(49, 13 + dy * 0.4));
    g.bezierCurveTo(...P(42, 12 + dy), ...P(38, 18 + dy), ...P(30 - dx, 15 + dy));
    g.bezierCurveTo(...P(36, 20 + dy), ...P(42, 16 + dy), ...P(49, 15.5 + dy * 0.4)); g.closePath(); g.fill();
  });
  // lance with pennant
  g.strokeStyle = CREAM; g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(...P(52, 50)); g.lineTo(...P(78, -4)); g.stroke();
  g.fillStyle = CREAM; g.beginPath(); g.moveTo(...P(78, -4)); g.lineTo(...P(75.5, 4)); g.lineTo(...P(80, 2)); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(...P(76, 3)); g.lineTo(...P(90, 6)); g.lineTo(...P(84, 9)); g.lineTo(...P(91, 13)); g.lineTo(...P(73.5, 9)); g.closePath(); g.fill();

  // ground: engraved hills + ground line
  g.strokeStyle = CREAM; g.lineWidth = 1;
  const gy = P(0, 85)[1];
  for (let i = 0; i < 5; i++) {
    g.beginPath();
    for (let x = b.x; x <= b.x + b.w; x += 4) g.lineTo(x, gy + 6 + i * 7 + Math.sin(x / 14 + i) * 2.2);
    g.stroke();
  }
  hatchClouds(b.x + 22, b.y + b.h - 6, 60, 1);
  hatchClouds(b.x + b.w - 22, b.y + b.h - 4, 60, -1);
  g.restore();
}

// ---------- THE ORACLE (eye in triangle) ----------
function oracle(b) {
  g.save(); g.beginPath(); g.rect(b.x, b.y, b.w, b.h); g.clip();
  const cx = b.x + b.w / 2, cy = b.y + b.h * 0.43;
  stars(b.x, b.y, b.w, b.h, 70, (x, y) => Math.hypot(x - cx, y - cy) < b.w * 0.55);
  rays(cx, cy, b.w * 0.24, b.w * 0.62, 72, 0.15, 0.9);
  // triangle
  const R = b.w * 0.36;
  const tri = [0, 1, 2].map(i => [cx + Math.cos(-Math.PI / 2 + i * 2 * Math.PI / 3) * R, cy + 8 + Math.sin(-Math.PI / 2 + i * 2 * Math.PI / 3) * R]);
  g.fillStyle = INK; g.strokeStyle = CREAM;
  g.beginPath(); tri.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); g.fill();
  g.lineWidth = 2.2; g.stroke();
  const tri2 = tri.map(([x, y]) => [cx + (x - cx) * 0.88, cy + 8 + (y - cy - 8) * 0.88]);
  g.lineWidth = 0.8; g.beginPath(); tri2.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); g.stroke();
  // eye
  const ey = cy + 16, ew = R * 0.62;
  g.fillStyle = CREAM;
  g.beginPath(); g.moveTo(cx - ew, ey); g.quadraticCurveTo(cx, ey - ew * 0.75, cx + ew, ey); g.quadraticCurveTo(cx, ey + ew * 0.75, cx - ew, ey); g.fill();
  g.fillStyle = INK; g.beginPath(); g.arc(cx, ey, ew * 0.36, 0, 7); g.fill();
  g.strokeStyle = CREAM; g.lineWidth = 0.7;
  for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2; g.beginPath(); g.moveTo(cx + Math.cos(a) * ew * 0.16, ey + Math.sin(a) * ew * 0.16); g.lineTo(cx + Math.cos(a) * ew * 0.33, ey + Math.sin(a) * ew * 0.33); g.stroke(); }
  g.fillStyle = CREAM; g.beginPath(); g.arc(cx - ew * 0.1, ey - ew * 0.1, ew * 0.06, 0, 7); g.fill();
  // lashes
  g.strokeStyle = CREAM; g.lineWidth = 1;
  for (let i = -3; i <= 3; i++) { const x = cx + i * ew * 0.22, y = ey - ew * 0.75 * (1 - (i / 3.6) ** 2) * 0.5 - 1; g.beginPath(); g.moveTo(x, y); g.lineTo(x + i * 1.2, y - 7); g.stroke(); }
  // crescent moons left/right
  [[b.x + 26, b.y + 30, 1], [b.x + b.w - 26, b.y + 30, -1]].forEach(([x, y, d]) => {
    g.fillStyle = CREAM; g.beginPath(); g.arc(x, y, 11, 0, 7); g.fill();
    g.fillStyle = INK; g.beginPath(); g.arc(x + d * 5, y - 2, 10, 0, 7); g.fill();
  });
  // chessboard altar
  const ay = b.y + b.h - 58, aw = b.w * 0.74, ax = cx - aw / 2, n = 8, cs = aw / n;
  for (let r = 0; r < 3; r++) for (let c = 0; c < n; c++) {
    const skew = (2 - r) * 4;
    g.fillStyle = (r + c) % 2 ? CREAM : INK;
    g.beginPath();
    g.moveTo(ax + c * cs + skew * (c - n / 2) / n * 2, ay + r * 11);
    g.lineTo(ax + (c + 1) * cs + skew * (c + 1 - n / 2) / n * 2, ay + r * 11);
    g.lineTo(ax + (c + 1) * cs + (skew - 4) * (c + 1 - n / 2) / n * 2, ay + (r + 1) * 11);
    g.lineTo(ax + c * cs + (skew - 4) * (c - n / 2) / n * 2, ay + (r + 1) * 11);
    g.closePath(); g.fill();
  }
  g.strokeStyle = CREAM; g.lineWidth = 1.2; g.strokeRect(ax - 4, ay - 2, aw + 8, 37);
  hatchClouds(b.x + 20, b.y + b.h - 2, 56, 1);
  hatchClouds(b.x + b.w - 20, b.y + b.h - 2, 56, -1);
  g.restore();
}

// ---------- layout ----------
const pad = 18, gap = 16;
const cardH = H - 2 * pad, cardW = Math.round(cardH * 0.585);
const img = new Image();
img.onload = () => {
  // original three cards: crop the white border, scale to height
  const sx = 1, sy = 5, sw = 629, sh = 350;
  const mw = Math.round(sw * cardH / sh);
  const total = cardW + gap + mw + gap + cardW;
  const x0 = Math.round((W - total) / 2);
  const b1 = card(x0, pad, cardW, cardH, 'THE ORACLE', 'XXI');
  oracle(b1);
  g.imageSmoothingQuality = 'high';
  g.globalCompositeOperation = 'multiply';
  g.drawImage(img, sx, sy, sw, sh, x0 + cardW + gap, pad, mw, cardH);
  g.globalCompositeOperation = 'source-over';
  const b2 = card(x0 + cardW + gap + mw + gap, pad, cardW, cardH, 'THE BLIND HORSEMAN', '0');
  horseman(b2);
  document.title = 'ready';
};
img.src = 'occult_src.png';
</script>
</body></html>
