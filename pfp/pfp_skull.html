<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<canvas id="c"></canvas>
<script>
// Crowned skull with cross, drawn light-on-dark like the source tarot cards.
// Pure greyscale here; x/tarot_grade.py maps it into the occult.webp palette.
const S = 400;
const cv = document.getElementById('c');
const dpr = window.devicePixelRatio || 1;
cv.width = S * dpr; cv.height = S * dpr; cv.style.width = S + 'px'; cv.style.height = S + 'px';
const g = cv.getContext('2d'); g.scale(dpr, dpr);
const LT = '#ffffff', DK = '#000000';
let seed = 21; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const C = S / 2;
const Q = new URLSearchParams(location.search);
const ZOOM = parseFloat(Q.get('z') || '1'), RING = Q.get('ring'), LAYER = Q.get('layer');
const blurOn = (px) => { g.filter = `blur(${px * ZOOM * dpr}px)`; }, blurOff = () => { g.filter = 'none'; };
g.fillStyle = '#000'; g.fillRect(0, 0, S, S);
g.translate(C, C + (ZOOM > 1 ? 18 * (ZOOM - 1) * 2 : 0)); g.scale(ZOOM, ZOOM); g.translate(-C, -C);

function star(x, y, r, pts = 4, inner = 0.26) {
  g.beginPath();
  for (let i = 0; i < pts * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / pts, rr = i % 2 ? r * inner : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  g.closePath(); g.fill();
}
function hatch(sp, ang, alpha, col = '255,255,255', lw = 0.8) {
  g.save(); g.clip();
  g.strokeStyle = `rgba(${col},${alpha})`; g.lineWidth = lw;
  const c = Math.cos(ang), s = Math.sin(ang);
  for (let t = -400; t < 400; t += sp) { g.beginPath(); g.moveTo(C - c * 400 - s * t, C - s * 400 + c * t); g.lineTo(C + c * 400 - s * t, C + s * 400 + c * t); g.stroke(); }
  g.restore();
}

// ---- field + stars ----
g.fillStyle = DK; g.fillRect(0, 0, S, S);
g.fillStyle = LT;
for (let i = 0; i < 110; i++) {
  const x = rnd() * S, y = rnd() * S;
  if (Math.hypot(x - C, y - (C + 6)) < 165) continue;
  if (rnd() < 0.6) { g.beginPath(); g.arc(x, y, 0.5 + rnd() * 1.1, 0, 7); g.fill(); } else star(x, y, 2.5 + rnd() * 4.5);
}

// ---- halo: fine rays + spikes, like the Memento Mori card (dimmed, misty) ----
const HY = C + 6;
g.save(); g.globalAlpha = 0.45;
g.strokeStyle = LT; g.lineWidth = 0.75;
for (let i = 0; i < 140; i++) { const a = i / 140 * Math.PI * 2, L = 150 + (i % 3) * 14 + rnd() * 8; g.beginPath(); g.moveTo(C + Math.cos(a) * 118, HY + Math.sin(a) * 118); g.lineTo(C + Math.cos(a) * L, HY + Math.sin(a) * L); g.stroke(); }
g.fillStyle = LT;
for (let i = 0; i < 12; i++) {
  const a = i / 12 * Math.PI * 2 + Math.PI / 12, L = i % 2 ? 168 : 190, d = 0.06;
  g.beginPath(); g.moveTo(C + Math.cos(a - d) * 118, HY + Math.sin(a - d) * 118); g.lineTo(C + Math.cos(a) * L, HY + Math.sin(a) * L); g.lineTo(C + Math.cos(a + d) * 118, HY + Math.sin(a + d) * 118); g.closePath(); g.fill();
}
// concentric halo rings
g.strokeStyle = LT;
[[118, 1.6], [112, 0.8], [106, 0.6]].forEach(([r, w]) => { g.lineWidth = w; g.beginPath(); g.arc(C, HY, r, 0, 7); g.stroke(); });
g.restore();
// cold mist glow behind the figure
{ const fg = g.createRadialGradient(C, HY - 10, 20, C, HY - 10, 190); fg.addColorStop(0, 'rgba(255,255,255,0.22)'); fg.addColorStop(0.55, 'rgba(255,255,255,0.07)'); fg.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = fg; g.fillRect(0, 0, S, S); }

// ---- hood: dark cowl behind the skull, crown sits on top of it ----
(() => {
  const hx = C, hy = C + 30;
  const outer = () => {
    g.beginPath();
    g.moveTo(hx - 175, S + 40);
    g.bezierCurveTo(hx - 150, hy + 110, hx - 118, hy + 70, hx - 104, hy - 10);
    g.bezierCurveTo(hx - 96, hy - 80, hx - 60, hy - 124, hx, hy - 128);
    g.bezierCurveTo(hx + 60, hy - 124, hx + 96, hy - 80, hx + 104, hy - 10);
    g.bezierCurveTo(hx + 118, hy + 70, hx + 150, hy + 110, hx + 175, S + 40);
    g.closePath();
  };
  const inner = () => {
    g.beginPath();
    g.moveTo(hx - 58, S + 60);
    g.bezierCurveTo(hx - 82, hy + 70, hx - 90, hy + 10, hx - 84, hy - 40);
    g.bezierCurveTo(hx - 76, hy - 92, hx - 40, hy - 106, hx, hy - 108);
    g.bezierCurveTo(hx + 40, hy - 106, hx + 76, hy - 92, hx + 84, hy - 40);
    g.bezierCurveTo(hx + 90, hy + 10, hx + 82, hy + 70, hx + 58, S + 60);
    g.closePath();
  };
  // cloth body
  outer(); g.fillStyle = DK; g.fill();
  // soft cloth volume: lit crown of the hood, falling into darkness
  g.save(); outer(); g.clip();
  { const hg = g.createRadialGradient(hx + 10, hy - 120, 10, hx, hy - 40, 230);
    hg.addColorStop(0, 'rgba(255,255,255,0.42)'); hg.addColorStop(0.35, 'rgba(255,255,255,0.16)'); hg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = hg; g.fillRect(0, 0, S, S); }
  // painterly folds: blurred light ridges + dark troughs following the hood
  for (let k = 0; k < 9; k++) {
    const f = 1 - k * 0.04, a = 0.10 + 0.12 * ((k + 1) % 2);
    blurOn(k % 2 ? 2.2 : 1.2);
    g.strokeStyle = k % 2 ? `rgba(0,0,0,0.6)` : `rgba(255,255,255,${a})`;
    g.lineWidth = k % 2 ? 5 : 2.2;
    g.beginPath();
    g.moveTo(hx - 175 * f, S + 40);
    g.bezierCurveTo(hx - 150 * f, hy + 110, hx - 118 * f, hy + 70, hx - 104 * f, hy - 10);
    g.bezierCurveTo(hx - 96 * f, hy - 80 * f, hx - 60 * f, hy - 124 * f, hx, hy - 128 * f + k * 0.6);
    g.bezierCurveTo(hx + 60 * f, hy - 124 * f, hx + 96 * f, hy - 80 * f, hx + 104 * f, hy - 10);
    g.bezierCurveTo(hx + 118 * f, hy + 70, hx + 150 * f, hy + 110, hx + 175 * f, S + 40);
    g.stroke();
  }
  blurOff();
  // fine thread texture
  for (let i = 0; i < 90; i++) {
    const d = rnd() < 0.5 ? -1 : 1, x0 = hx + d * (60 + rnd() * 110), y0 = hy - 120 + rnd() * 120;
    g.strokeStyle = `rgba(255,255,255,${0.04 + rnd() * 0.1})`; g.lineWidth = 0.5 + rnd() * 0.6;
    g.beginPath(); g.moveTo(x0, y0); g.bezierCurveTo(x0 + d * 10, y0 + 60, x0 + d * 24, y0 + 140, x0 + d * (30 + rnd() * 40), S + 30); g.stroke();
  }
  g.restore();
  // ghostly wisps escaping the hood (like torn veil strands)
  for (let i = 0; i < 70; i++) {
    const d = rnd() < 0.5 ? -1 : 1;
    const t = rnd(), x0 = hx + d * (96 + t * 40), y0 = hy - 70 + t * 170;
    const len = 40 + rnd() * 120, curl = (rnd() - 0.3) * 60;
    g.strokeStyle = `rgba(255,255,255,${0.05 + rnd() * 0.28})`; g.lineWidth = 0.4 + rnd() * 1.1;
    if (rnd() < 0.3) blurOn(0.8); else blurOff();
    g.beginPath(); g.moveTo(x0, y0);
    g.bezierCurveTo(x0 + d * len * 0.35, y0 - curl * 0.4, x0 + d * len * 0.7, y0 + curl, x0 + d * len, y0 + curl * 0.6 + len * 0.3);
    g.stroke();
  }
  blurOff();
  // bright hood edge
  outer(); g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = 1.3; blurOn(0.6); g.stroke(); blurOff();
  // face opening: deep shadow + light inner rim
  inner(); g.fillStyle = DK; g.fill();
  // inner lip of the hood catches a little light
  inner(); g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 2.5; blurOn(1.5); g.stroke(); blurOff();
  inner(); g.strokeStyle = 'rgba(255,255,255,0.5)'; g.lineWidth = 0.8; g.stroke();
})();

// ---- skull ----
const sx = C, sy = C + 30; // skull centre (cranium)
g.lineJoin = 'round'; g.lineCap = 'round';
// cranium + cheek outline
const skullPath = () => {
  g.beginPath();
  g.moveTo(sx - 62, sy + 8);
  g.bezierCurveTo(sx - 74, sy - 40, sx - 50, sy - 84, sx, sy - 86);
  g.bezierCurveTo(sx + 50, sy - 84, sx + 74, sy - 40, sx + 62, sy + 8);
  g.bezierCurveTo(sx + 60, sy + 22, sx + 52, sy + 30, sx + 46, sy + 36);
  g.lineTo(sx + 40, sy + 52);
  g.bezierCurveTo(sx + 30, sy + 56, sx + 14, sy + 58, sx, sy + 58);
  g.bezierCurveTo(sx - 14, sy + 58, sx - 30, sy + 56, sx - 40, sy + 52);
  g.lineTo(sx - 46, sy + 36);
  g.bezierCurveTo(sx - 52, sy + 30, sx - 60, sy + 22, sx - 62, sy + 8);
  g.closePath();
};
// shadow the skull casts into the hood
skullPath(); g.fillStyle = 'rgba(0,0,0,0.9)'; blurOn(10); g.fill(); blurOff();
// bone base: aged, not paper-white
skullPath(); g.fillStyle = '#c2c2c2'; g.fill();
g.save(); skullPath(); g.clip();
// volume: lit from above-right, edges roll into shadow
{ const vg = g.createRadialGradient(sx + 12, sy - 52, 8, sx, sy - 20, 92);
  vg.addColorStop(0, 'rgba(255,255,255,0.7)'); vg.addColorStop(0.4, 'rgba(255,255,255,0)'); vg.addColorStop(0.72, 'rgba(0,0,0,0.45)'); vg.addColorStop(1, 'rgba(0,0,0,0.92)');
  g.fillStyle = vg; g.fillRect(sx - 100, sy - 100, 200, 200); }
// temple hollows (soft, no lines)
blurOn(7); g.fillStyle = 'rgba(0,0,0,0.55)';
[[-1], [1]].forEach(([d]) => { g.beginPath(); g.ellipse(sx + d * 58, sy - 6, 12, 22, d * 0.2, 0, 7); g.fill(); });
// cheek hollows under the zygomatic arch
g.fillStyle = 'rgba(0,0,0,0.5)';
[[-1], [1]].forEach(([d]) => { g.beginPath(); g.ellipse(sx + d * 38, sy + 30, 10, 14, d * -0.3, 0, 7); g.fill(); });
blurOff();
// sculpting highlights
blurOn(4); g.fillStyle = 'rgba(255,255,255,0.55)';
[[-1], [1]].forEach(([d]) => {
  g.beginPath(); g.ellipse(sx + d * 28, sy - 30, 16, 5, d * 0.25, 0, 7); g.fill();     // brow ridge
  g.beginPath(); g.ellipse(sx + d * 34, sy + 12, 10, 4, d * -0.35, 0, 7); g.fill();    // cheekbone
});
g.beginPath(); g.ellipse(sx, sy - 6, 3, 9, 0, 0, 7); g.fill();                            // nasal bridge
g.beginPath(); g.ellipse(sx + 6, sy - 62, 22, 12, 0.2, 0, 7); g.fill();                   // forehead dome
blurOff();
blurOn(9); g.fillStyle = 'rgba(0,0,0,0.45)';
g.beginPath(); g.ellipse(sx, sy + 46, 40, 14, 0, 0, 7); g.fill();                         // under-nose / upper jaw shadow
blurOff();
// bone grain: speckles and pits
for (let i = 0; i < 2600; i++) {
  const x = sx - 75 + rnd() * 150, y = sy - 90 + rnd() * 150, r = rnd() * 0.45 + 0.12;
  g.fillStyle = rnd() < 0.75 ? `rgba(0,0,0,${0.05 + rnd() * 0.1})` : `rgba(255,255,255,${0.08 + rnd() * 0.12})`;
  g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
}
// mottled staining
blurOn(4);
for (let i = 0; i < 28; i++) { g.fillStyle = `rgba(0,0,0,${0.04 + rnd() * 0.08})`; g.beginPath(); g.ellipse(sx - 60 + rnd() * 120, sy - 80 + rnd() * 130, 4 + rnd() * 12, 3 + rnd() * 8, rnd() * 3, 0, 7); g.fill(); }
blurOff();
g.restore();
// skull suture (crack)
g.strokeStyle = 'rgba(0,0,0,0.8)'; g.lineWidth = 0.9;
g.beginPath(); g.moveTo(sx + 6, sy - 86); g.lineTo(sx + 2, sy - 76); g.lineTo(sx + 8, sy - 68); g.lineTo(sx + 4, sy - 62); g.lineTo(sx + 11, sy - 55); g.stroke();
g.beginPath(); g.moveTo(sx - 30, sy - 78); g.lineTo(sx - 26, sy - 70); g.lineTo(sx - 31, sy - 62); g.lineTo(sx - 27, sy - 54); g.stroke();
g.beginPath(); g.moveTo(sx - 52, sy - 30); g.lineTo(sx - 46, sy - 26); g.lineTo(sx - 48, sy - 18); g.stroke();

// forehead sigil: carved alchemical mark (circle, cross below, crescent on top)
g.strokeStyle = 'rgba(0,0,0,0.7)'; g.lineWidth = 1.2;
g.beginPath(); g.arc(sx, sy - 46, 5.5, 0, 7); g.stroke();
g.beginPath(); g.moveTo(sx, sy - 40.5); g.lineTo(sx, sy - 31); g.moveTo(sx - 4.5, sy - 35); g.lineTo(sx + 4.5, sy - 35); g.stroke();
g.beginPath(); g.arc(sx, sy - 57, 5.5, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
g.fillStyle = DK; g.beginPath(); g.arc(sx, sy - 46, 1.4, 0, 7); g.fill();

// eye sockets: angular, slanted down toward the nose (scowl), sharp outer corners.
// no brow/temple strokes running outward -> nothing that reads as glasses frames.
const orbit = (d) => {
  const ex = sx + d * 26, ey = sy - 10;
  g.beginPath();
  g.moveTo(ex - d * 15, ey - 2);                                   // inner corner, low (by the nose)
  g.lineTo(ex + d * 2,  ey - 13);                                  // brow slopes UP and out
  g.quadraticCurveTo(ex + d * 14, ey - 18, ex + d * 19, ey - 14);  // sharp outer-top corner
  g.quadraticCurveTo(ex + d * 18, ey + 4, ex + d * 6, ey + 13);    // outer wall drops
  g.quadraticCurveTo(ex - d * 6, ey + 16, ex - d * 13, ey + 8);    // lower rim
  g.closePath();
};
// soft occlusion around both sockets
blurOn(5); g.fillStyle = 'rgba(0,0,0,0.75)';
[[-1], [1]].forEach(([d]) => { g.save(); g.translate(sx + d * 26, sy - 8); g.scale(1.35, 1.35); g.translate(-(sx + d * 26), -(sy - 8)); orbit(d); g.fill(); g.restore(); });
blurOff();
[[-1], [1]].forEach(([d]) => {
  orbit(d); g.fillStyle = DK; g.fill();
  // depth: faint hatching on the lower inner wall only
  g.save(); orbit(d); g.clip();
  g.strokeStyle = 'rgba(255,255,255,0.28)'; g.lineWidth = 0.6;
  for (let t = 0; t < 9; t++) { const y = sy - 10 + 7 + t * 1.5; g.beginPath(); g.moveTo(sx + d * 26 - 22, y); g.lineTo(sx + d * 26 + 22, y - d * 3); g.stroke(); }
  g.restore();

  // short brow-bone shadow hugging the top edge (stays inside the skull)
  g.strokeStyle = 'rgba(0,0,0,0.55)'; g.lineWidth = 2; blurOn(1);
  g.beginPath(); g.moveTo(sx + d * 12, sy - 15); g.lineTo(sx + d * 28, sy - 25); g.quadraticCurveTo(sx + d * 38, sy - 29, sx + d * 42, sy - 26); g.stroke(); blurOff();
});
// ---- cyborg damage: bone sheared off around the right orbit, chrome skull beneath ----
{
  const ex = sx + 26, ey = sy - 9;
  const brk = () => { g.beginPath();
    const P = [[-12, -22], [-3, -27], [6, -24], [14, -31], [24, -24], [30, -12], [27, 0], [31, 9], [22, 18], [12, 16], [4, 23], [-6, 17], [-14, 10], [-12, 0], [-17, -9]];
    P.forEach(([x, y], i) => i ? g.lineTo(ex + x, ey + y) : g.moveTo(ex + x, ey + y)); g.closePath(); };
  // metal plate with brushed gradient
  brk(); { const mg = g.createLinearGradient(ex - 20, ey - 30, ex + 30, ey + 25);
    mg.addColorStop(0, '#9a9a9a'); mg.addColorStop(0.35, '#4a4a4a'); mg.addColorStop(0.6, '#bdbdbd'); mg.addColorStop(1, '#2a2a2a');
    g.fillStyle = mg; g.fill(); }
  g.save(); brk(); g.clip();
  // panel seams + rivets
  g.strokeStyle = 'rgba(0,0,0,0.85)'; g.lineWidth = 0.9;
  g.beginPath(); g.moveTo(ex + 18, ey - 30); g.lineTo(ex + 22, ey + 20); g.moveTo(ex - 20, ey + 11); g.lineTo(ex + 30, ey + 13); g.stroke();
  g.fillStyle = '#e8e8e8';
  [[24, -18], [26, 4], [-8, 14], [10, 19], [-10, -16]].forEach(([x, y]) => { g.beginPath(); g.arc(ex + x, ey + y, 1.3, 0, 7); g.fill(); });
  g.fillStyle = '#111';
  [[24.4, -17.6], [26.4, 4.4], [-7.6, 14.4], [10.4, 19.4], [-9.6, -15.6]].forEach(([x, y]) => { g.beginPath(); g.arc(ex + x, ey + y, 0.6, 0, 7); g.fill(); });
  g.restore();
  // jagged bone edge: dark crack line + lit chipped lip
  brk(); g.strokeStyle = 'rgba(0,0,0,0.95)'; g.lineWidth = 1.6; g.stroke();
  brk(); g.save(); g.translate(-0.8, -0.8); g.strokeStyle = 'rgba(255,255,255,0.45)'; g.lineWidth = 0.7; g.stroke(); g.restore();
  // hairline fractures radiating from the break
  g.strokeStyle = 'rgba(0,0,0,0.7)'; g.lineWidth = 0.7;
  [[[14, -31], [18, -40], [16, -48]], [[30, -12], [40, -14], [46, -8]], [[22, 18], [26, 28], [33, 31]]].forEach(seg => {
    g.beginPath(); seg.forEach(([x, y], i) => i ? g.lineTo(ex + x, ey + y) : g.moveTo(ex + x, ey + y)); g.stroke(); });
  // eye housing: black socket + steel ring
  g.fillStyle = '#050505'; g.beginPath(); g.arc(ex, ey + 1, 10.5, 0, 7); g.fill();
  g.strokeStyle = '#8c8c8c'; g.lineWidth = 2.2; g.beginPath(); g.arc(ex, ey + 1, 10.5, 0, 7); g.stroke();
  g.strokeStyle = '#2b2b2b'; g.lineWidth = 0.8; g.beginPath(); g.arc(ex, ey + 1, 8.2, 0, 7); g.stroke();
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; g.strokeStyle = '#bbbbbb'; g.lineWidth = 0.6; g.beginPath(); g.moveTo(ex + Math.cos(a) * 11.5, ey + 1 + Math.sin(a) * 11.5); g.lineTo(ex + Math.cos(a) * 13, ey + 1 + Math.sin(a) * 13); g.stroke(); }
}
// scowl furrow between the brows


// nasal cavity: sharper, tall inverted heart
g.fillStyle = DK;
g.beginPath();
g.moveTo(sx, sy + 6);
g.bezierCurveTo(sx - 3, sy + 14, sx - 12, sy + 25, sx - 9, sy + 31);
g.lineTo(sx, sy + 26);
g.lineTo(sx + 9, sy + 31);
g.bezierCurveTo(sx + 12, sy + 25, sx + 3, sy + 14, sx, sy + 6);
g.closePath(); g.fill();

// ---- mouth: occult, menacing ----
// maxilla plate
g.fillStyle = '#c4c4c4';
g.beginPath(); g.moveTo(sx - 36, sy + 34); g.lineTo(sx + 36, sy + 34); g.lineTo(sx + 34, sy + 50); g.lineTo(sx - 34, sy + 50); g.closePath(); g.fill();
// jaw (mandible), slightly dropped open
const JD = 0;
g.beginPath();
g.moveTo(sx - 38, sy + 54 + JD);
g.lineTo(sx + 38, sy + 54 + JD);
g.bezierCurveTo(sx + 40, sy + 72 + JD, sx + 32, sy + 88 + JD, sx + 14, sy + 92 + JD);
g.lineTo(sx - 14, sy + 92 + JD);
g.bezierCurveTo(sx - 32, sy + 88 + JD, sx - 40, sy + 72 + JD, sx - 38, sy + 54 + JD);
g.closePath(); g.fill();
g.save(); g.beginPath();
g.moveTo(sx - 38, sy + 56 + JD); g.bezierCurveTo(sx - 40, sy + 72 + JD, sx - 32, sy + 88 + JD, sx - 14, sy + 92 + JD); g.lineTo(sx - 20, sy + 70 + JD); g.closePath();
g.fillStyle = 'rgba(0,0,0,0.5)'; blurOn(5); g.fill(); blurOff(); g.restore();
g.save(); g.beginPath();
g.moveTo(sx + 38, sy + 56 + JD); g.bezierCurveTo(sx + 40, sy + 72 + JD, sx + 32, sy + 88 + JD, sx + 14, sy + 92 + JD); g.lineTo(sx + 20, sy + 70 + JD); g.closePath();
g.fillStyle = 'rgba(0,0,0,0.35)'; blurOn(5); g.fill(); blurOff(); g.restore();
// dark open mouth between the rows
g.fillStyle = DK;
g.beginPath(); g.moveTo(sx - 33, sy + 42); g.lineTo(sx + 33, sy + 42); g.lineTo(sx + 31, sy + 68); g.lineTo(sx - 31, sy + 68); g.closePath(); g.fill();
// realistic teeth: long exposed roots, worn rounded edges, uneven, gaps
function tooth(x, yRoot, len, w, up, sharp = 0) {
  const tip = up ? yRoot + len : yRoot - len, dir = up ? 1 : -1;
  const tg = g.createLinearGradient(x, yRoot, x, tip);
  tg.addColorStop(0, '#5e5e5e'); tg.addColorStop(0.35, '#bdbdbd'); tg.addColorStop(0.8, '#ececec'); tg.addColorStop(1, '#cfcfcf');
  g.fillStyle = tg; g.strokeStyle = 'rgba(0,0,0,0.9)'; g.lineWidth = 0.8;
  const wr = w * 0.78; // narrower at the root
  g.beginPath();
  g.moveTo(x - wr / 2, yRoot);
  g.bezierCurveTo(x - w / 2, yRoot + dir * len * 0.4, x - w / 2, tip - dir * len * 0.25, x - w * (sharp ? 0.15 : 0.42), tip);
  g.quadraticCurveTo(x, tip + dir * (sharp ? 2.2 : 0.9), x + w * (sharp ? 0.15 : 0.42), tip);
  g.bezierCurveTo(x + w / 2, tip - dir * len * 0.25, x + w / 2, yRoot + dir * len * 0.4, x + wr / 2, yRoot);
  g.closePath(); g.fill(); g.stroke();
  // enamel highlight
  g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = 0.6;
