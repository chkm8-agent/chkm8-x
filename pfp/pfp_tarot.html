<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0e0d0b}canvas{display:block}</style></head>
<body>
<canvas id="c"></canvas>
<script>
const S = 400;
const cv = document.getElementById('c');
const dpr = window.devicePixelRatio || 1;
cv.width = S * dpr; cv.height = S * dpr; cv.style.width = S + 'px'; cv.style.height = S + 'px';
const g = cv.getContext('2d'); g.scale(dpr, dpr);
const CREAM = '#efe3c4', INK = '#0e0d0b';
let seed = 9; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const C = S / 2;

function star(x, y, r, pts = 4, inner = 0.28) {
  g.beginPath();
  for (let i = 0; i < pts * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / pts, rr = i % 2 ? r * inner : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  g.closePath(); g.fill();
}

// field
g.fillStyle = INK; g.fillRect(0, 0, S, S);
// stars (outside the sun)
g.fillStyle = CREAM;
for (let i = 0; i < 90; i++) {
  const x = rnd() * S, y = rnd() * S;
  if (Math.hypot(x - C, y - C) < 150) continue;
  if (rnd() < 0.6) { g.beginPath(); g.arc(x, y, 0.6 + rnd(), 0, 7); g.fill(); } else star(x, y, 3 + rnd() * 4);
}
// fine rays
g.strokeStyle = CREAM; g.lineWidth = 0.8;
for (let i = 0; i < 96; i++) { const a = i / 96 * Math.PI * 2, L = i % 2 ? 150 : 178; g.beginPath(); g.moveTo(C + Math.cos(a) * 112, C + Math.sin(a) * 112); g.lineTo(C + Math.cos(a) * L, C + Math.sin(a) * L); g.stroke(); }
// spikes
g.fillStyle = CREAM;
for (let i = 0; i < 16; i++) {
  const a = i / 16 * Math.PI * 2 + Math.PI / 16, L = i % 2 ? 150 : 176, d = 0.07;
  g.beginPath(); g.moveTo(C + Math.cos(a - d) * 112, C + Math.sin(a - d) * 112); g.lineTo(C + Math.cos(a) * L, C + Math.sin(a) * L); g.lineTo(C + Math.cos(a + d) * 112, C + Math.sin(a + d) * 112); g.closePath(); g.fill();
}
// sun disc with rings
g.beginPath(); g.arc(C, C, 112, 0, 7); g.fill();
g.strokeStyle = INK; g.lineWidth = 1.2;
[106, 102].forEach(r => { g.beginPath(); g.arc(C, C, r, 0, 7); g.stroke(); });
// tiny ticks on ring
for (let i = 0; i < 64; i++) { const a = i / 64 * Math.PI * 2; g.beginPath(); g.moveTo(C + Math.cos(a) * 102, C + Math.sin(a) * 102); g.lineTo(C + Math.cos(a) * 98, C + Math.sin(a) * 98); g.stroke(); }

// chess king silhouette, INK on cream, centered
const k = 1.0, ox = C, oy = C + 6;
const P = (x, y) => [ox + x * k, oy + y * k];
g.fillStyle = INK;
g.beginPath();
const pts = [
  [-6, -92], [6, -92], [6, -84], [14, -84], [14, -74], [6, -74], [6, -66],      // cross
  [26, -60], [34, -48], [30, -34], [20, -26],                                   // crown bulb right
  [24, -22], [24, -16], [14, -14],                                              // collar
  [16, 30], [26, 42], [26, 50], [40, 58], [40, 74], [-40, 74], [-40, 58], [-26, 50], [-26, 42], [-16, 30],
  [-14, -14], [-24, -16], [-24, -22], [-20, -26],
  [-30, -34], [-34, -48], [-26, -60], [-6, -66], [-6, -74], [-14, -74], [-14, -84], [-6, -84]
];
pts.forEach((p, i) => i ? g.lineTo(...P(...p)) : g.moveTo(...P(...p)));
g.closePath(); g.fill();
// engraved hatching on the king (cream lines clipped to shape)
g.save(); g.clip();
g.strokeStyle = 'rgba(239,227,196,0.22)'; g.lineWidth = 0.8;
for (let t = -200; t < 200; t += 3.2) { g.beginPath(); g.moveTo(C - 200, C + t - 120); g.lineTo(C + 200, C + t + 120); g.stroke(); }
g.restore();
// blindfold across the crown bulb, ribbons trailing
g.fillStyle = CREAM;
g.fillRect(...P(-33, -50), 66, 11);
g.fillStyle = INK; g.fillRect(...P(-33, -48), 66, 1.2); g.fillRect(...P(-33, -42), 66, 1.2);
g.fillStyle = INK;
g.beginPath(); g.moveTo(...P(33, -49)); g.bezierCurveTo(...P(48, -52), ...P(56, -40), ...P(66, -46)); g.bezierCurveTo(...P(58, -32), ...P(46, -40), ...P(33, -40)); g.closePath(); g.fill();
g.beginPath(); g.moveTo(...P(33, -45)); g.bezierCurveTo(...P(46, -38), ...P(50, -26), ...P(62, -24)); g.bezierCurveTo(...P(50, -18), ...P(42, -30), ...P(33, -40)); g.closePath(); g.fill();
// third eye on the king's body
g.fillStyle = CREAM;
const [ex, ey] = P(0, 14);
g.beginPath(); g.moveTo(ex - 14, ey); g.quadraticCurveTo(ex, ey - 11, ex + 14, ey); g.quadraticCurveTo(ex, ey + 11, ex - 14, ey); g.fill();
g.fillStyle = INK; g.beginPath(); g.arc(ex, ey, 4.6, 0, 7); g.fill();
g.fillStyle = CREAM; g.beginPath(); g.arc(ex - 1.3, ey - 1.3, 1.2, 0, 7); g.fill();
// base bands
g.fillStyle = CREAM; g.fillRect(...P(-26, 52), 52, 2); g.fillRect(...P(-40, 62), 80, 1.5);
// tiny checkerboard ground under the piece
const gy = oy + 74 * k + 4;
for (let c = 0; c < 8; c++) { g.fillStyle = c % 2 ? CREAM : INK; g.fillRect(C - 48 + c * 12, gy, 12, 6); }
g.strokeStyle = INK; g.lineWidth = 1; g.strokeRect(C - 48, gy, 96, 6);

// crescent moons left / right
[[52, 70, 1], [S - 52, 70, -1]].forEach(([x, y, d]) => {
  g.fillStyle = CREAM; g.beginPath(); g.arc(x, y, 13, 0, 7); g.fill();
  g.fillStyle = INK; g.beginPath(); g.arc(x + d * 6, y - 2, 12, 0, 7); g.fill();
});
document.title = 'ready';
</script>
</body></html>
